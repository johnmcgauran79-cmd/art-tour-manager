name: Supabase storage backup

on:
  schedule:
    # 17:00 UTC Sunday = 03:00 Monday Brisbane (AEST, UTC+10)
    - cron: "0 17 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEBHOOK: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -n "$SERVICE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$WEBHOOK" ] || missing="$missing BACKUP_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Downloads every object from every bucket except the backup bucket itself.
      - name: Download storage objects
        id: dump
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/storage_backup.py
          STAMP=$(date -u +%Y-%m-%d)
          ARTIFACT="art-storage-$STAMP.tar.gz"
          tar czf "$ARTIFACT" storage-dump
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$ARTIFACT")" >> "$GITHUB_OUTPUT"


      # Off-site copy in the private "database-backups" bucket, split into 40MB
      # parts so each upload stays under the project-wide file size limit.
      - name: Upload backup to Supabase Storage
        id: upload
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.dump.outputs.artifact }}"
          STAMP=$(date -u +%Y-%m-%d)
          split -b 40m -d -a 3 "$ARTIFACT" "part-"
          COUNT=0
          for f in part-*; do
            NAME="$ARTIFACT.$f"
            URL="https://upqvgtuxfzsrwjahklij.supabase.co/storage/v1/object/database-backups/storage/$STAMP/$NAME"
            CODE=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Content-Type: application/octet-stream" \
              -H "x-upsert: true" \
              --data-binary "@$f")
            if [ "$CODE" != "200" ]; then
              echo "::error::Storage upload failed for $NAME ($CODE): $(cat /tmp/upload.json)"
              exit 1
            fi
            COUNT=$((COUNT+1))
          done
          echo "Uploaded $COUNT part(s)."
          echo "destination=supabase://database-backups/storage/$STAMP/ ($COUNT parts)" >> "$GITHUB_OUTPUT"

      # Third cloud copy: SharePoint document library. Skipped silently when the
      # SharePoint secrets are absent, and never fails the run.
      - name: Copy backup to SharePoint
        id: sharepoint
        continue-on-error: true
        env:
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          SHAREPOINT_SITE_PATH: ${{ secrets.SHAREPOINT_SITE_PATH }}
          SHAREPOINT_FOLDER: ${{ vars.SHAREPOINT_FOLDER }}
        run: python3 .github/scripts/sharepoint_upload.py storage "${{ steps.dump.outputs.artifact }}"

      - name: Report result to the app
        if: always()
        env:
          SECRET: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failed"; fi
          curl -sS -X POST \
            "https://upqvgtuxfzsrwjahklij.supabase.co/functions/v1/backup-report" \
            -H "Content-Type: application/json" \
            -H "x-backup-secret: $SECRET" \
            -d "$(cat <<JSON
          {
            "source": "github-actions",
            "kind": "storage",
            "status": "$STATUS",
            "started_at": "${{ steps.start.outputs.at }}",
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "size_bytes": ${{ steps.dump.outputs.size || 0 }},
            "artifact_name": "${{ steps.dump.outputs.artifact }}",
            "destination": "${{ steps.upload.outputs.destination }}${{ steps.sharepoint.outputs.destination && format(' + {0}', steps.sharepoint.outputs.destination) || '' }}",
            "metadata": { "files": "${{ steps.dump.outputs.files }}", "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
          }
          JSON
          )"
