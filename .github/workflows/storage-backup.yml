name: Supabase storage backup

on:
  schedule:
    # 17:00 UTC Sunday = 03:00 Monday Brisbane (AEST, UTC+10)
    - cron: "0 17 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEBHOOK: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -n "$SERVICE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$WEBHOOK" ] || missing="$missing BACKUP_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repository secrets:$missing"
            exit 1
          fi

      # Downloads every object from every bucket except the backup bucket itself.
      - name: Download storage objects
        id: dump
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          PROJECT = "https://upqvgtuxfzsrwjahklij.supabase.co"
          KEY = os.environ["SERVICE_KEY"]
          SKIP = {"database-backups"}
          ROOT = pathlib.Path("storage-dump")

          def api(path, body=None, raw=False):
              req = urllib.request.Request(
                  f"{PROJECT}/storage/v1/{path}",
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                  },
                  method="POST" if body is not None else "GET",
              )
              with urllib.request.urlopen(req, timeout=300) as r:
                  return r.read() if raw else json.loads(r.read())

          def download(bucket, key, dest):
              req = urllib.request.Request(
                  f"{PROJECT}/storage/v1/object/{bucket}/{urllib.parse.quote(key)}",
                  headers={"Authorization": f"Bearer {KEY}"},
              )
              dest.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(req, timeout=600) as r, open(dest, "wb") as f:
                  while chunk := r.read(1 << 20):
                      f.write(chunk)

          import urllib.parse

          def walk(bucket, prefix=""):
              offset = 0
              while True:
                  items = api(
                      f"object/list/{bucket}",
                      {"prefix": prefix, "limit": 1000, "offset": offset,
                       "sortBy": {"column": "name", "order": "asc"}},
                  )
                  if not items:
                      return
                  for it in items:
                      name = f"{prefix}{it['name']}"
                      if it.get("id") is None and it.get("metadata") is None:
                          yield from walk(bucket, name + "/")
                      else:
                          yield name
                  if len(items) < 1000:
                      return
                  offset += len(items)

          buckets = [b["name"] for b in api("bucket") if b["name"] not in SKIP]
          count = 0
          manifest = []
          for bucket in buckets:
              for key in walk(bucket):
                  dest = ROOT / bucket / key
                  download(bucket, key, dest)
                  manifest.append({"bucket": bucket, "key": key, "bytes": dest.stat().st_size})
                  count += 1
          ROOT.mkdir(exist_ok=True)
          (ROOT / "manifest.json").write_text(json.dumps(manifest, indent=1))
          print(f"Downloaded {count} object(s) from {len(buckets)} bucket(s).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"files={count}\n")
          PY
          STAMP=$(date -u +%Y-%m-%d)
          ARTIFACT="art-storage-$STAMP.tar.gz"
          tar czf "$ARTIFACT" storage-dump
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$ARTIFACT")" >> "$GITHUB_OUTPUT"

      # Off-site copy in the private "database-backups" bucket, split into 40MB
      # parts so each upload stays under the project-wide file size limit.
      - name: Upload backup to Supabase Storage
        id: upload
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.dump.outputs.artifact }}"
          STAMP=$(date -u +%Y-%m-%d)
          split -b 40m -d -a 3 "$ARTIFACT" "part-"
          COUNT=0
          for f in part-*; do
            NAME="$ARTIFACT.$f"
            URL="https://upqvgtuxfzsrwjahklij.supabase.co/storage/v1/object/database-backups/storage/$STAMP/$NAME"
            CODE=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Content-Type: application/octet-stream" \
              -H "x-upsert: true" \
              --data-binary "@$f")
            if [ "$CODE" != "200" ]; then
              echo "::error::Storage upload failed for $NAME ($CODE): $(cat /tmp/upload.json)"
              exit 1
            fi
            COUNT=$((COUNT+1))
          done
          echo "Uploaded $COUNT part(s)."
          echo "destination=supabase://database-backups/storage/$STAMP/ ($COUNT parts)" >> "$GITHUB_OUTPUT"

      - name: Report result to the app
        if: always()
        env:
          SECRET: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failed"; fi
          curl -sS -X POST \
            "https://upqvgtuxfzsrwjahklij.supabase.co/functions/v1/backup-report" \
            -H "Content-Type: application/json" \
            -H "x-backup-secret: $SECRET" \
            -d "$(cat <<JSON
          {
            "source": "github-actions",
            "kind": "storage",
            "status": "$STATUS",
            "started_at": "${{ steps.start.outputs.at }}",
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "size_bytes": ${{ steps.dump.outputs.size || 0 }},
            "artifact_name": "${{ steps.dump.outputs.artifact }}",
            "destination": "${{ steps.upload.outputs.destination }}",
            "metadata": { "files": "${{ steps.dump.outputs.files }}", "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
          }
          JSON
          )"
