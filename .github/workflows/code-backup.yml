name: Source code backup

on:
  schedule:
    # 16:30 UTC daily = 02:30 Brisbane (AEST, UTC+10)
    - cron: "30 16 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEBHOOK: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -n "$SERVICE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$WEBHOOK" ] || missing="$missing BACKUP_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repository secrets:$missing"
            exit 1
          fi

      # Full history, every branch and tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git bundle
        id: bundle
        run: |
          set -euo pipefail
          git fetch --tags --force --prune origin '+refs/heads/*:refs/remotes/origin/*' || true
          STAMP=$(date -u +%Y-%m-%d)
          ARTIFACT="art-code-$STAMP.bundle"
          git bundle create "$ARTIFACT" --all
          git bundle verify "$ARTIFACT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$ARTIFACT")" >> "$GITHUB_OUTPUT"
          echo "commits=$(git rev-list --all --count)" >> "$GITHUB_OUTPUT"

      # Quick-grab copy, kept by GitHub for 90 days.
      - name: Attach bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ steps.bundle.outputs.artifact }}
          retention-days: 90

      # Off-site copy in the private "database-backups" bucket, split into 40MB
      # parts so each upload stays under the project-wide file size limit.
      - name: Upload bundle to Supabase Storage
        id: upload
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.bundle.outputs.artifact }}"
          STAMP=$(date -u +%Y-%m-%d)
          split -b 40m -d -a 3 "$ARTIFACT" "part-"
          COUNT=0
          for f in part-*; do
            NAME="$ARTIFACT.$f"
            URL="https://upqvgtuxfzsrwjahklij.supabase.co/storage/v1/object/database-backups/code/$STAMP/$NAME"
            CODE=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Content-Type: application/octet-stream" \
              -H "x-upsert: true" \
              --data-binary "@$f")
            if [ "$CODE" != "200" ]; then
              echo "::error::Storage upload failed for $NAME ($CODE): $(cat /tmp/upload.json)"
              exit 1
            fi
            COUNT=$((COUNT+1))
          done
          echo "Uploaded $COUNT part(s)."
          echo "destination=supabase://database-backups/code/$STAMP/ ($COUNT parts)" >> "$GITHUB_OUTPUT"

      - name: Report result to the app
        if: always()
        env:
          SECRET: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failed"; fi
          curl -sS -X POST \
            "https://upqvgtuxfzsrwjahklij.supabase.co/functions/v1/backup-report" \
            -H "Content-Type: application/json" \
            -H "x-backup-secret: $SECRET" \
            -d "$(cat <<JSON
          {
            "source": "github-actions",
            "kind": "code",
            "status": "$STATUS",
            "started_at": "${{ steps.start.outputs.at }}",
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "size_bytes": ${{ steps.bundle.outputs.size || 0 }},
            "artifact_name": "${{ steps.bundle.outputs.artifact }}",
            "destination": "${{ steps.upload.outputs.destination }}",
            "metadata": { "commits": "${{ steps.bundle.outputs.commits }}", "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
          }
          JSON
          )"
