name: Supabase database backup

on:
  schedule:
    # 16:00 UTC = 02:00 Brisbane (AEST, UTC+10)
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEBHOOK: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -n "$DB_URL" ] || missing="$missing SUPABASE_DB_URL"
          [ -n "$SERVICE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$WEBHOOK" ] || missing="$missing BACKUP_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repository secrets:$missing"
            exit 1
          fi

      - name: Dump database
        id: dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          supabase db dump --db-url "$DB_URL" --role-only -f roles.sql
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f data.sql
          ARTIFACT="art-backup-$STAMP.tar.gz"
          tar czf "$ARTIFACT" roles.sql schema.sql data.sql
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$ARTIFACT")" >> "$GITHUB_OUTPUT"

      # Off-site copy: private Supabase Storage bucket "database-backups"
      - name: Upload backup to Supabase Storage
        id: upload
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.dump.outputs.artifact }}"
          PATH_IN_BUCKET="database/$ARTIFACT"
          URL="https://upqvgtuxfzsrwjahklij.supabase.co/storage/v1/object/database-backups/$PATH_IN_BUCKET"
          CODE=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/gzip" \
            -H "x-upsert: true" \
            --data-binary "@$ARTIFACT")
          if [ "$CODE" != "200" ]; then
            echo "::error::Storage upload failed ($CODE): $(cat /tmp/upload.json)"
            exit 1
          fi
          echo "destination=supabase://database-backups/$PATH_IN_BUCKET" >> "$GITHUB_OUTPUT"

      # Also keep a 30-day copy attached to the workflow run itself
      - name: Attach backup to workflow run
        if: always() && steps.dump.outputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.artifact }}
          path: ${{ steps.dump.outputs.artifact }}
          retention-days: 30

      - name: Report result to the app
        if: always()
        env:
          SECRET: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failed"; fi
          curl -sS -X POST \
            "https://upqvgtuxfzsrwjahklij.supabase.co/functions/v1/backup-report" \
            -H "Content-Type: application/json" \
            -H "x-backup-secret: $SECRET" \
            -d "$(cat <<JSON
          {
            "source": "github-actions",
            "kind": "database",
            "status": "$STATUS",
            "started_at": "${{ steps.start.outputs.at }}",
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "size_bytes": ${{ steps.dump.outputs.size || 0 }},
            "artifact_name": "${{ steps.dump.outputs.artifact }}",
            "destination": "${{ steps.upload.outputs.destination }}",
            "metadata": { "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
          }
          JSON
          )"